version = 1

[sources.python-testing-with-pytest]
repo = "jashburn8020/python-testing-with-pytest"
branch = "master"

[sources.api-guidelines]
repo = "rust-lang/api-guidelines"
branch = "master"

[sources.patterns]
repo = "rust-unofficial/patterns"
branch = "main"
exclude = ["theme/book.js"] # Symlink alias; third_party/mdbook/book.js is included.

[sources.idiomatic-rust]
repo = "mre/idiomatic-rust"
branch = "master"

[sources.emacs-lisp-style-guide]
repo = "bbatsov/emacs-lisp-style-guide"
branch = "master"

[sources.emacs-lisp-elements]
repo = "protesilaos/emacs-lisp-elements"
branch = "main"

[sources.emacs-package-dev-handbook]
repo = "alphapapa/emacs-package-dev-handbook"
branch = "master"

[sources.awesome-elisp]
repo = "emacs-tw/awesome-elisp"
branch = "master"

[sources.emacs-lisp-manual-tips]
url = "https://git.savannah.gnu.org/cgit/emacs.git/plain/doc/lispref/tips.texi?h=emacs-31.1"
digest = "sha256:9cd1fc1181beed81d24cba4f4fbd6b27e9c05f21dcf8702d79b28ebb58ea0df6"

[sources.ripgrep]
git = "https://github.com/BurntSushi/ripgrep.git"
branch = "master"
exclude = ["HomebrewFormula"] # Symlink alias; pkg/brew is included.

[sources.redb]
git = "https://github.com/cberner/redb.git"
branch = "master"

[sources.tokio]
git = "https://github.com/tokio-rs/tokio.git"
branch = "master"

[sources.serde]
git = "https://github.com/serde-rs/serde.git"
branch = "master"
# Package aliases point to files and directories already included in this snapshot.
exclude = [
    "serde/LICENSE-APACHE",
    "serde/LICENSE-MIT",
    "serde/README.md",
    "serde/crates-io.md",
    "serde/src/core",
    "serde_core/LICENSE-APACHE",
    "serde_core/LICENSE-MIT",
    "serde_derive/LICENSE-APACHE",
    "serde_derive/LICENSE-MIT",
    "serde_derive/README.md",
    "serde_derive/crates-io.md",
    "serde_derive_internals/LICENSE-APACHE",
    "serde_derive_internals/LICENSE-MIT",
    "serde_derive_internals/src",
]

[sources.rust-book]
git = "https://github.com/rust-lang/book.git"
branch = "main"

[targets.python-resources]
path = "resources/languages/python"
layout = "by-source"

[targets.python-resources.sources]
python-testing-with-pytest = { template = false, collapse = false }

[targets.rust-resources]
path = "resources/languages/rust"
layout = "by-source"

[targets.rust-resources.sources]
api-guidelines = { template = false, collapse = false }
patterns = { template = false, collapse = false }
idiomatic-rust = { template = false, collapse = false }
ripgrep = { template = false, collapse = false }
redb = { template = false, collapse = false }
tokio = { template = false, collapse = false }
serde = { template = false, collapse = false }
rust-book = { template = false, collapse = false }

[targets.elisp-resources]
path = "resources/languages/elisp"
layout = "by-source"

[targets.elisp-resources.sources]
emacs-lisp-style-guide = { template = false, collapse = false }
emacs-lisp-elements = { template = false, collapse = false }
emacs-package-dev-handbook = { template = false, collapse = false }
awesome-elisp = { template = false, collapse = false }
emacs-lisp-manual-tips = {}
