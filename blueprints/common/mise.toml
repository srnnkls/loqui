[settings]
experimental = true

[tools]
hk = { version = "2.13.0", postinstall = "hk install --mise", depends = ["pkl"] }
pkl = "0.33.1"
"github:srnnkls/phora" = "0.5.0"
uv = "0.13.9"

[tasks."loqui:check"]
description = "Run every loqui gate: format, lint, type check, tests"
run = "hk check --all"

[tasks."loqui:fix"]
description = "Apply loqui formatters and fixers"
run = "hk fix --all"

[tasks."loqui:verify"]
description = "Fail when managed loqui files drifted from the pinned blueprints"
run = ["phora sync --frozen --force", "git diff --exit-code"]

[tasks."loqui:update"]
description = "Refetch the loqui runner, move the blueprints to its commit, then gate"
run = ["mise run --no-cache loqui update", "hk check --all"]
