name: release-plz

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  release-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: if [ -f rust-toolchain.toml ] || [ -f rust-toolchain ]; then rustup toolchain install; fi
      # An app token lets the release PR trigger CI; GITHUB_TOKEN cannot.
      - id: app-token
        if: vars.RELEASE_APP_ID != ''
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release-pr
          version: 0.4.3
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      actions: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: if [ -f rust-toolchain.toml ] || [ -f rust-toolchain ]; then rustup toolchain install; fi
      - id: release
        uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release
          version: 0.4.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Tags pushed with GITHUB_TOKEN trigger no workflow; workflow_dispatch is exempt.
      - name: dispatch cargo-dist
        if: steps.release.outputs.releases_created == 'true' && hashFiles('.github/workflows/release.yml') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASES: ${{ steps.release.outputs.releases }}
        run: |
          jq -r '[.[].tag] | unique[]' <<<"$RELEASES" | while read -r tag; do
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --silent || continue
            gh workflow run release.yml --ref "$tag" -f tag="$tag"
          done
